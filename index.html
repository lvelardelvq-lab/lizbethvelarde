<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lizbeth Velarde | Gestión de Riesgos — SINAGERD y PMBOK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #12151E;
      --bg-surface: #181C28;
      --bg-surface-hover: #1E2332;
      --bg-elevated: #22283A;
      --border-subtle: rgba(226, 228, 236, 0.08);
      --border-hover: rgba(157, 142, 199, 0.28);
      --text-primary: #E2E4EC;
      --text-secondary: #B0B5C4;
      --text-muted: #7C8296;
      --accent: #9D8EC7;
      --accent-soft: rgba(157, 142, 199, 0.12);
      --accent-border: rgba(157, 142, 199, 0.25);
      --sinagerd-bg: rgba(114, 152, 196, 0.12);
      --sinagerd-text: #9AB8DB;
      --pmbok-bg: rgba(157, 142, 199, 0.12);
      --pmbok-text: #BDB0E0;
      --hybrid-bg: rgba(130, 173, 156, 0.12);
      --hybrid-text: #9EC7B7;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, textarea, select {
      font-family: inherit;
      font-size: inherit;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(18, 21, 30, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      font-size: 14.5px;
      color: var(--text-primary);
      cursor: pointer;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .btn-ghost:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
      background: var(--bg-surface);
    }

    .btn-primary {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--text-primary);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary:hover {
      background: rgba(157, 142, 199, 0.2);
      border-color: var(--accent);
    }

    /* Admin Toolbar */
    .admin-bar {
      display: none;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--accent-border);
    }

    .admin-bar.active {
      display: block;
    }

    .admin-bar-inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 10px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .admin-label {
      font-size: 12.5px;
      color: var(--accent);
      font-weight: 500;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Main Container */
    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* Hero */
    .hero {
      padding-bottom: 36px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 32px;
    }

    .hero-eyebrow {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-primary);
      letter-spacing: -0.015em;
      max-width: 720px;
      margin-bottom: 14px;
    }

    .hero-bio {
      font-size: 14.5px;
      color: var(--text-secondary);
      max-width: 740px;
      margin-bottom: 22px;
      line-height: 1.7;
    }

    .hero-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .social-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .social-pill:hover {
      border-color: var(--border-hover);
      background: var(--bg-surface-hover);
    }
